# Шаг 2.3: один пробный запрос к каждому источнику с серверов GitHub. Запускается только вручную:
# Actions → «Пробные запросы к источникам» → Run workflow.
name: Пробные запросы к источникам

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run probe
