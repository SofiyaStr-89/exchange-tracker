# Обслуживание данных (SPEC: «Архитектура»):
# каждую ночь — координаты новых точек и часы работы новых отделений myfin (если таких нет — запросов нет);
# раз в неделю — пересборка списков обменников из OpenStreetMap.
# Раз в сутки, а не чаще: каждый запуск будит базу Neon (лимит бесплатных часов вычислений).
# Нужен секрет репозитория DATABASE_URL (Settings → Secrets and variables → Actions).
name: Обслуживание данных

on:
  schedule:
    - cron: '20 1 * * *' # каждую ночь, 01:20 UTC (03:20 Варшава, 04:20 Минск)
    - cron: '40 2 * * 1' # понедельник 02:40 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      # Без секрета базы обслуживание пропускается с пометкой, а не падает (и GitHub не шлёт письмо каждый час).
      - name: Нет секрета DATABASE_URL — пропускаем
        if: env.DATABASE_URL == ''
        run: echo "::notice::Секрет DATABASE_URL не задан — обслуживание пропущено."
      - uses: actions/checkout@v5
        if: env.DATABASE_URL != ''
      - uses: actions/setup-node@v5
        if: env.DATABASE_URL != ''
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.DATABASE_URL != ''
      - name: Еженедельно — списки из OpenStreetMap
        if: env.DATABASE_URL != '' && (github.event.schedule == '40 2 * * 1' || github.event_name == 'workflow_dispatch')
        run: npm run weekly
      - name: Координаты новых точек
        if: env.DATABASE_URL != ''
        run: npm run geocode
      - name: Сверка координат источников с адресом (новые точки)
        if: env.DATABASE_URL != ''
        run: npm run check-coords -- 300
      - name: Часы работы новых отделений myfin (не больше 500 страниц за ночь, ~25 минут)
        if: env.DATABASE_URL != ''
        run: npm run myfin-details -- 500
