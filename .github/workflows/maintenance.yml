# Обслуживание данных (SPEC: «Архитектура»):
# каждый час — координаты новых точек и часы работы новых отделений myfin (если таких нет — запросов нет);
# раз в неделю — пересборка списков обменников из OpenStreetMap.
# Нужен секрет репозитория DATABASE_URL (Settings → Secrets and variables → Actions).
name: Обслуживание данных

on:
  schedule:
    - cron: '17 * * * *' # каждый час
    - cron: '40 2 * * 1' # понедельник 02:40 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      # Без секрета базы обслуживание пропускается с пометкой, а не падает (и GitHub не шлёт письмо каждый час).
      - name: Нет секрета DATABASE_URL — пропускаем
        if: env.DATABASE_URL == ''
        run: echo "::notice::Секрет DATABASE_URL не задан — обслуживание пропущено."
      - uses: actions/checkout@v5
        if: env.DATABASE_URL != ''
      - uses: actions/setup-node@v5
        if: env.DATABASE_URL != ''
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.DATABASE_URL != ''
      - name: Еженедельно — списки из OpenStreetMap
        if: env.DATABASE_URL != '' && (github.event.schedule == '40 2 * * 1' || github.event_name == 'workflow_dispatch')
        run: npm run weekly
      - name: Координаты новых точек
        if: env.DATABASE_URL != ''
        run: npm run geocode
      - name: Часы работы новых отделений myfin (не больше 150 страниц за запуск)
        if: env.DATABASE_URL != ''
        run: npm run myfin-details -- 150
